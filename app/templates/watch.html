{% extends "base.html" %}

{% block page_content %}
<section class="sheet rise d1">
  <div class="eyebrow">Entry — standing order · TikTok</div>
  <h1>Wait for a broadcast<br>that hasn’t started</h1>
  <p class="lede">For a creator who’s offline. Capture begins the moment they go live.</p>

  <form id="watch-form" class="form">
    <div class="field">
      <label for="watch-source">Subject — username or live URL</label>
      <input id="watch-source" type="text" placeholder="@example_creator">
    </div>
    <div class="field">
      <label for="watch-duration">Duration in seconds — optional</label>
      <input id="watch-duration" type="number" min="1" placeholder="blank = until the live ends">
    </div>
    <div class="row">
      <button class="btn" type="submit">Place the order</button>
      <button class="btn btn-quiet" type="button" id="clear-watch-form">Clear</button>
    </div>
  </form>
  <div id="watch-notice" class="notice">The order stands until they go live.</div>
</section>

<div class="filed-head rise d2">
  <h2>Filed</h2><span class="rule"></span>
  <button class="btn btn-quiet btn-sm" type="button" id="refresh-watch-list">Refresh</button>
</div>
<div id="watch-container" class="rise d3"></div>
{% endblock %}

{% block page_scripts %}
<script src="{{ (base_path or '') ~ '/static/js/watch-page.js?v=5' }}"></script>
<script>initWatchPage();</script>
{% endblock %}
